[package]
name = "folio-beta"
version = "0.1.0"
description = "Evidence-first bookkeeping and tax workspace — desktop client (Tauri, no Electron)"
edition = "2021"
authors = ["TAX BUILD ALPHA"]
license = "Proprietary"
repository = "https://github.com/anomalyco/Tax-Build-Alpha"

[lib]
name = "folio_beta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tauri-plugin-opener = "2.5.5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
