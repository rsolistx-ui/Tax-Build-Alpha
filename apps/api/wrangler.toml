name = "folio-api"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

[vars]
LLM_PROVIDER = "mock"
BETTER_AUTH_URL = "http://localhost:8787"

# Secrets (set via: wrangler secret put ...):
#   BETTER_AUTH_SECRET
#   GEMINI_API_KEY

[[d1_databases]]
binding = "DB"
database_name = "folio-db"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "../../migrations"

[[r2_buckets]]
binding = "RECEIPTS"
bucket_name = "folio-receipts"

# Queues stub — create with: wrangler queues create folio-jobs
# Uncomment when the queue exists in your Cloudflare account:
# [[queues.producers]]
# binding = "JOBS_QUEUE"
# queue = "folio-jobs"
#
# [[queues.consumers]]
# queue = "folio-jobs"
# max_batch_size = 5
# max_retries = 3

[dev]
port = 8787
