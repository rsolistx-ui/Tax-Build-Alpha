name = "folio-api"
main = "src/index.ts"
compatibility_date = "2026-09-05"
compatibility_flags = ["nodejs_compat"]

[vars]
LLM_PROVIDER = "workers-ai"
BETTER_AUTH_URL = "https://folio-api.rsolistx.workers.dev"
APP_ORIGIN = "https://folio-api.rsolistx.workers.dev"

# Secrets:
#   BETTER_AUTH_SECRET   Better Auth encryption/session secret
#   DATABASE_URL        Neon pooled PostgreSQL connection string
#   GROQ_API_KEY        Optional Groq vision fallback if Workers AI extraction fails
#   GEMINI_API_KEY      Optional Gemini fallback if Workers AI extraction fails

# D1 is intentionally auth-only in the married architecture.
# Existing app tables from the original alpha may remain but are no longer read.
[[d1_databases]]
binding = "AUTH_DB"
database_name = "folio-db"
database_id = "e6893c3a-8ea4-4242-96b2-8b18adc543af"
migrations_dir = "../../migrations"

[[r2_buckets]]
binding = "RECEIPTS"
bucket_name = "folio-receipts"

[ai]
binding = "AI"

# The paid alpha is served from one Worker origin. React/Vite assets are uploaded
# with the API so Better Auth cookies remain first-party and no Pages-to-Worker
# third-party cookie path is required.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Queues remain a scale-up option. Receipt extraction stays inline for the paid alpha
# until the queue consumer is implemented and tested end-to-end.
# [[queues.producers]]
# binding = "JOBS_QUEUE"
# queue = "folio-jobs"

# The deterministic supervisor runs twice hourly around the clock. It creates
# only idempotent, approval-required review work from existing evidence; it
# does not poll a model, alter books, or send client communications. The
# weekday 13:00 UTC operations pass also stages due reminders and diagnostics.
[triggers]
crons = ["0 13 * * 1-5", "*/30 * * * *"]

# Workers Logs: keeps console output and exceptions so a 500's requestId
# (logged by app.onError) can be traced after the fact, not only via live tail.
[observability]
enabled = true
head_sampling_rate = 1

# Folio's local dev port deliberately avoids 8787/8789, which are occupied by
# another project on this machine (polymarket engine dev servers).
[dev]
port = 8791
